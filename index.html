<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>STANDOFF MINI 3D</title>

<style>

*{box-sizing:border-box;touch-action:none}

body{margin:0;overflow:hidden;background:#101820;font-family:Arial;color:white}

#game{position:fixed;inset:0}

#hud{

 position:absolute;top:12px;left:0;width:100%;

 display:flex;justify-content:space-around;

 font-weight:bold;font-size:15px;pointer-events:none

}

.panel{background:#101820bb;padding:10px;border-radius:10px}

#controls{position:absolute;bottom:20px;width:100%;height:155px}

#stick{

 position:absolute;left:25px;bottom:15px;

 width:115px;height:115px;border-radius:50%;

 background:#ffffff30;border:2px solid #ffffff80

}

#knob{

 position:absolute;width:48px;height:48px;

 background:#ffffffaa;border-radius:50%;

 left:31px;top:31px

}

.action{

 position:absolute;border:2px solid white;

 border-radius:50%;background:#ff573dcc;

 color:white;font-weight:bold;

 width:65px;height:65px

}

#fire{right:25px;bottom:15px}

#aim{right:100px;bottom:75px;background:#2277ccdd}

#reload{right:105px;bottom:0;background:#555}

#message{

 position:absolute;top:43%;width:100%;

 text-align:center;font-size:24px;font-weight:bold;

 pointer-events:none

}

</style>

</head>

<body>

<div id="game"></div>

<div id="hud">

 <div class="panel">❤️ HP: <span id="hp">100</span></div>

 <div class="panel">🔫 <span id="ammo">20</span>/20</div>

 <div class="panel">🏆 <span id="score">0</span></div>

</div>

<div id="message">STANDOFF MINI 3D</div>

<div id="controls">

 <div id="stick"><div id="knob"></div></div>

 <button class="action" id="fire">FIRE</button>

 <button class="action" id="aim">AIM</button>

 <button class="action" id="reload">R</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x87b8d8);

scene.fog=new THREE.Fog(0x87b8d8,20,65);

const camera=new THREE.PerspectiveCamera(

 70,innerWidth/innerHeight,.1,1000

);

camera.position.set(0,2,7);

const renderer=new THREE.WebGLRenderer({antialias:true});

renderer.setSize(innerWidth,innerHeight);

renderer.setPixelRatio(Math.min(devicePixelRatio,2));

document.getElementById("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));

const light=new THREE.DirectionalLight(0xffffff,2);

light.position.set(5,10,5);

scene.add(light);

const floor=new THREE.Mesh(

 new THREE.PlaneGeometry(100,100),

 new THREE.MeshStandardMaterial({color:0x777777})

);

floor.rotation.x=-Math.PI/2;

scene.add(floor);

const grid=new THREE.GridHelper(100,50,0xffffff,0x555555);

grid.position.y=.02;

scene.add(grid);

// Арена

for(let i=0;i<18;i++){

 const wall=new THREE.Mesh(

  new THREE.BoxGeometry(2,2,2),

  new THREE.MeshStandardMaterial({color:0x667788})

 );

 wall.position.set(

  (Math.random()-.5)*28,1,

  (Math.random()-.5)*28

 );

 scene.add(wall);

}

// Игрок

const player=new THREE.Group();

scene.add(player);

const body=new THREE.Mesh(

 new THREE.BoxGeometry(.7,1.2,.5),

 new THREE.MeshStandardMaterial({color:0x2277cc})

);

body.position.y=.9;

player.add(body);

const head=new THREE.Mesh(

 new THREE.SphereGeometry(.28,16,16),

 new THREE.MeshStandardMaterial({color:0xffcc99})

);

head.position.y=1.7;

player.add(head);

player.position.set(0,0,7);

let hp=100,ammo=20,score=0;

let yaw=0,pitch=0;

let bullets=[],bots=[];

let moving={x:0,y:0};

let reloading=false;

function updateHUD(){

 document.getElementById("hp").textContent=hp;

 document.getElementById("ammo").textContent=ammo;

 document.getElementById("score").textContent=score;

}

// Боты

function createBot(){

 const bot=new THREE.Group();

 const material=new THREE.MeshStandardMaterial({color:0xe34b4b});

 const torso=new THREE.Mesh(

  new THREE.BoxGeometry(.8,1.2,.6),material

 );

 torso.position.y=.9;

 bot.add(torso);

 const head=new THREE.Mesh(

  new THREE.SphereGeometry(.3,16,16),

  new THREE.MeshStandardMaterial({color:0xffcc99})

 );

 head.position.y=1.7;

 bot.add(head);

 bot.position.set(

  (Math.random()-.5)*18,0,

  -5-Math.random()*15

 );

 scene.add(bot);

 bots.push(bot);

}

for(let i=0;i<5;i++)createBot();

// Камера

function cameraUpdate(){

 camera.position.set(

  player.position.x,

  player.position.y+2.1,

  player.position.z

 );

 camera.rotation.order="YXZ";

 camera.rotation.y=yaw;

 camera.rotation.x=pitch;

}

// Выстрелы — светящиеся игровые снаряды

function fire(){

 if(ammo<=0||reloading)return;

 ammo--;

 updateHUD();

 const bullet=new THREE.Mesh(

  new THREE.SphereGeometry(.12,12,12),

  new THREE.MeshBasicMaterial({color:0x00ffff})

 );

 bullet.position.copy(camera.position);

 const direction=new THREE.Vector3(0,0,-1);

 direction.applyQuaternion(camera.quaternion);

 bullet.userData.velocity=direction.multiplyScalar(.65);

 bullet.userData.life=60;

 scene.add(bullet);

 bullets.push(bullet);

}

function reload(){

 if(reloading||ammo===20)return;

 reloading=true;

 document.getElementById("reload").textContent="...";

 setTimeout(()=>{

  ammo=20;

  reloading=false;

  document.getElementById("reload").textContent="R";

  updateHUD();

 },1200);

}

function updateBullets(){

 for(let i=bullets.length-1;i>=0;i--){

  const b=bullets[i];

  b.position.add(b.userData.velocity);

  b.userData.life--;

  let hit=false;

  for(let j=bots.length-1;j>=0;j--){

   if(b.position.distanceTo(

    bots[j].position.clone().add(new THREE.Vector3(0,1,0))

   )<1){

    scene.remove(bots[j]);

    bots.splice(j,1);

    score++;

    updateHUD();

    createBot();

    hit=true;

    break;

   }

  }

  if(hit||b.userData.life<=0){

   scene.remove(b);

   bullets.splice(i,1);

  }

 }

}

// Управление джойстиком

const stick=document.getElementById("stick");

const knob=document.getElementById("knob");

let stickOn=false;

stick.addEventListener("pointerdown",e=>{

 stickOn=true;

 stick.setPointerCapture(e.pointerId);

 moveStick(e);

});

stick.addEventListener("pointermove",e=>{

 if(stickOn)moveStick(e);

});

function moveStick(e){

 const r=stick.getBoundingClientRect();

 let x=e.clientX-(r.left+r.width/2);

 let y=e.clientY-(r.top+r.height/2);

 const d=Math.sqrt(x*x+y*y);

 if(d>35){x=x/d*35;y=y/d*35}

 knob.style.transform=`translate(${x}px,${y}px)`;

 moving.x=x/35;

 moving.y=y/35;

}

function stopStick(){

 stickOn=false;

 moving={x:0,y:0};

 knob.style.transform="translate(0,0)";

}

stick.addEventListener("pointerup",stopStick);

stick.addEventListener("pointercancel",stopStick);

// Поворот камеры свайпом

let lastX=0,lastY=0,lookOn=false;

renderer.domElement.addEventListener("pointerdown",e=>{

 lookOn=true;

 lastX=e.clientX;

 lastY=e.clientY;

});

renderer.domElement.addEventListener("pointermove",e=>{

 if(!lookOn)return;

 yaw-=(e.clientX-lastX)*.006;

 pitch-=(e.clientY-lastY)*.006;

 pitch=Math.max(-1,Math.min(1,pitch));

 lastX=e.clientX;

 lastY=e.clientY;

});

renderer.domElement.addEventListener("pointerup",()=>lookOn=false);

renderer.domElement.addEventListener("pointercancel",()=>lookOn=false);

document.getElementById("fire").onclick=fire;

document.getElementById("reload").onclick=reload;

document.getElementById("aim").onclick=()=>{

 camera.fov=camera.fov===70?40:70;

 camera.updateProjectionMatrix();

};

function animate(){

 requestAnimationFrame(animate);

 const speed=.12;

 player.position.x+=(

  Math.cos(yaw)*moving.x+

  Math.sin(yaw)*moving.y

 )*speed;

 player.position.z+=(

  -Math.sin(yaw)*moving.x+

  Math.cos(yaw)*moving.y

 )*speed;

 cameraUpdate();

 updateBullets();

 bots.forEach(bot=>{

  bot.rotation.y=Math.atan2(

   player.position.x-bot.position.x,

   player.position.z-bot.position.z

  );

 });

 renderer.render(scene,camera);

}

animate();

addEventListener("resize",()=>{

 camera.aspect=innerWidth/innerHeight;

 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);

});

</script>

</body>

</html>
